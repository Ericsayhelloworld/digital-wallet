# Digital Wallet Platform. Start everything with:  docker compose up --build   (OPS-1)
# Published on the host: web (the application), Grafana, Prometheus and Zipkin (OPS: own host ports),
# and PostgreSQL and Kafka for local development tools. The services themselves are reachable only
# inside this network.

x-spring-health: &spring-health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

# OPS-4 JSON logs, OPS-5 Prometheus endpoint, OPS-6 tracing to Zipkin, for every Spring Boot service
x-observability: &observability
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
  SPRING_KAFKA_TEMPLATE_OBSERVATIONENABLED: "true"
  SPRING_KAFKA_LISTENER_OBSERVATIONENABLED: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ---------- observability (Section 3: Prometheus, Grafana and a tracing backend) ----------

  zipkin:
    image: openzipkin/zipkin:3.4
    ports:
      - "9411:9411"
    # the image brings its own health check

  prometheus:
    image: prom/prometheus:v2.53.2
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wallet.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- the services ----------

  auth-service:
    build: ./auth-service
    environment:
      <<: *observability
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health/readiness || exit 1"]

  bank-simulator:
    build: ./bank-simulator
    environment:
      <<: *observability
      BANK_API_KEY: ${BANK_API_KEY}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET}
      WEBHOOK_URL: http://wallet-service:8082/internal/webhooks/bank
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health/readiness || exit 1"]

  wallet-service:
    build: ./wallet-service
    environment:
      <<: *observability
      DB_URL: jdbc:postgresql://postgres:5432/wallet_db
      DB_USER: wallet_user
      DB_PASSWORD: ${WALLET_DB_PASSWORD}
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      KAFKA_BOOTSTRAP: kafka:9092
      BANK_URL: http://bank-simulator:8084
      BANK_API_KEY: ${BANK_API_KEY}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      bank-simulator:
        condition: service_healthy
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health/readiness || exit 1"]

  notification-service:
    build: ./notification-service
    environment:
      <<: *observability
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health/readiness || exit 1"]

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      AUTH_URL: http://auth-service:8081
      WALLET_URL: http://wallet-service:8082
      NOTIFICATION_URL: http://notification-service:8083
      BANK_URL: http://bank-simulator:8084
    depends_on:
      auth-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      bank-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
